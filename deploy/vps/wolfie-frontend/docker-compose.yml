name: wolfie-frontend

services:
  wolfie-frontend:
    image: nginx@sha256:54f2a904c251d5a34adf545a72d32515a15e08418dae0266e23be2e18c66fefa
    container_name: wolfie-frontend
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    volumes:
      - ./current:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - wisewolf
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      # A primeira release permanece interna até o cutover validar o DNS.
      - traefik.enable=${WOLFIE_TRAEFIK_ENABLE:-false}
      - traefik.docker.network=wisewolf
      - 'traefik.http.routers.wolfie-web.rule=Host(`wolfie.wisewolflanguage.com.br`)'
      - traefik.http.routers.wolfie-web.entrypoints=websecure
      - traefik.http.routers.wolfie-web.tls=true
      - traefik.http.routers.wolfie-web.tls.certresolver=le
      - traefik.http.routers.wolfie-web.service=wolfie-web
      - traefik.http.services.wolfie-web.loadbalancer.server.port=80

networks:
  wisewolf:
    external: true
