map $uri $wolfie_cache_control {
    default                                            "no-cache";
    ~^/(?:index\.html|sw\.js|registerSW\.js)$          "no-cache, no-store, must-revalidate";
    /manifest.webmanifest                             "no-cache, must-revalidate";
    ~*^/assets/.*-[A-Za-z0-9_-]+\.(?:css|js)$         "public, max-age=31536000, immutable";
    ~^/assets/                                         "public, max-age=604800, stale-while-revalidate=86400";
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name wolfie.wisewolflanguage.com.br;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
    add_header Cache-Control $wolfie_cache_control always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /index.html {
        try_files $uri =404;
    }

    location = /sw.js {
        try_files $uri =404;
    }

    location = /registerSW.js {
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        try_files $uri =404;
    }

    # Bundles produzidos pelo Vite têm hash no nome e podem ser imutáveis.
    location ~* ^/assets/.*-[A-Za-z0-9_-]+\.(?:css|js)$ {
        try_files $uri =404;
    }

    # Cenas e personagens possuem versionamento próprio, mas alguns aliases são
    # estáveis. Uma semana evita prender o cliente a um visual antigo por um ano.
    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
