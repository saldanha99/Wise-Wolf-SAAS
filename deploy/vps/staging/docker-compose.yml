name: wisewolf-staging

services:
  wisewolf-staging:
    image: nginx:1.29-alpine
    container_name: wisewolf-staging
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    volumes:
      - ./current:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - wisewolf
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - traefik.enable=true
      - traefik.docker.network=wisewolf
      - 'traefik.http.routers.wisewolf-staging.rule=Host(`wisewolf-staging.2timeweb.com.br`)'
      - traefik.http.routers.wisewolf-staging.entrypoints=websecure
      - traefik.http.routers.wisewolf-staging.tls=true
      - traefik.http.routers.wisewolf-staging.tls.certresolver=le
      - traefik.http.routers.wisewolf-staging.service=wisewolf-staging
      - traefik.http.services.wisewolf-staging.loadbalancer.server.port=80
      - traefik.http.middlewares.wisewolf-staging-noindex.headers.customresponseheaders.X-Robots-Tag=noindex,nofollow,noarchive,nosnippet,noimageindex
      - traefik.http.routers.wisewolf-staging.middlewares=wisewolf-staging-noindex

networks:
  wisewolf:
    external: true
