server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name app.wisewolflanguage.com.br system.wisewolflanguage.com.br;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Compacta somente recursos textuais. MP4s e imagens já comprimidos ficam
    # fora da lista para não consumir CPU nem alterar suporte a byte ranges.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rss+xml
        application/wasm
        application/xml
        font/woff
        font/woff2
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # The HTML and PWA bootstrap must be revalidated so a cutover cannot keep
    # clients pinned to an old bundle/API endpoint.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location = /registerSW.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location ~ ^/(pwa-critical-refresh-[A-Za-z0-9._-]+\.js|workbox-[A-Za-z0-9._-]+\.js)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Os vídeos do Hub mantêm nomes estáveis entre renders e precisam revalidar.
    location ~ ^/assets/hub/videos/captions/[A-Za-z0-9._-]+\.vtt$ {
        default_type text/vtt;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        try_files $uri =404;
    }

    location /assets/hub/videos/ {
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        try_files $uri =404;
    }

    # Vite fingerprints files under /assets, so immutable caching is safe.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The dedicated-host copies are implementation details and must never be
    # addressable through app/system, where they would create duplicate pages.
    location = /__hub_host {
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 404;
    }

    location ^~ /__hub_host/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 404;
    }

    # O sitemap lista as URLs canônicas de marketing; o robots aponta para ele e
    # barra as rotas que só existem atrás de um token pessoal.
    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        try_files $uri =404;
    }

    location = /robots.txt {
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        try_files $uri =404;
    }

    location ~ ^/(seja-professor|new-saas)/?$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files /$1/index.html =404;
    }

    # Each public Hub landing has its own build-time HTML document. Crawlers,
    # WhatsApp and other unfurlers receive the correct metadata without waiting
    # for React, while the application bundle stays shared.
    location = /hub {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        error_page 404 /hub/404.html;
        try_files /hub/index.html =404;
    }

    location = /hub/ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        error_page 404 /hub/404.html;
        try_files /hub/index.html =404;
    }

    location ~ ^/hub/(professores|escolas|biblioteca|educador-ia|wolfie|saas-escolar|termos|privacidade)/?$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        error_page 404 /hub/404.html;
        try_files /hub/$1/index.html =404;
    }

    location = /hub/404.html {
        internal;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files /hub/404.html =404;
    }

    location /hub/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        error_page 404 /hub/404.html;
        return 404;
    }

    # React/Vite client-side routes must fall back to the SPA entry point.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name hub.wisewolflanguage.com.br;

    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rss+xml
        application/wasm
        application/xml
        font/woff
        font/woff2
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    location ~ ^/assets/hub/videos/captions/[A-Za-z0-9._-]+\.vtt$ {
        default_type text/vtt;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        try_files $uri =404;
    }

    location /assets/hub/videos/ {
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location = /registerSW.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location ~ ^/(pwa-critical-refresh-[A-Za-z0-9._-]+\.js|workbox-[A-Za-z0-9._-]+\.js)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ~ ^/(apple-touch-icon\.png|pwa-192x192\.png|pwa-512x512\.png|pwa-maskable-512x512\.png)$ {
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # Sem estas duas rotas o catch-all abaixo devolveria 404 para o crawler.
    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        try_files /__hub_host/sitemap.xml =404;
    }

    location = /robots.txt {
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        try_files /__hub_host/robots.txt =404;
    }

    location = / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        error_page 404 /__hub_host/404.html;
        try_files /__hub_host/index.html =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        error_page 404 /__hub_host/404.html;
        try_files /__hub_host/index.html =404;
    }

    location ~ ^/(professores|escolas|biblioteca|educador-ia|wolfie|saas-escolar|termos|privacidade)/?$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        error_page 404 /__hub_host/404.html;
        try_files /__hub_host/$1/index.html =404;
    }

    location = /__hub_host/404.html {
        internal;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files /__hub_host/404.html =404;
    }

    location / {
        add_header X-Robots-Tag "noindex, nofollow" always;
        error_page 404 /__hub_host/404.html;
        return 404;
    }
}
