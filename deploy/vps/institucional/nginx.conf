server {
  listen 80;
  server_name blog.wisewolflanguage.com.br;

  location = / {
    return 301 https://wisewolflanguage.com.br/blog$is_args$args;
  }

  location ~ ^/wp-content/uploads/(.+)$ {
    return 301 https://wisewolflanguage.com.br/blog/media/$1$is_args$args;
  }

  location ~ "^/[0-9]{4}/[0-9]{2}/[0-9]{2}/([^/]+)/?$" {
    return 301 https://wisewolflanguage.com.br/blog/$1$is_args$args;
  }

  location ~ ^/([a-z0-9-]+)/?$ {
    return 301 https://wisewolflanguage.com.br/blog/$1$is_args$args;
  }

  location ~ ^/(?:index\.php/)?glossario/([^/]+)/?$ {
    return 301 https://wisewolflanguage.com.br/glossario/$1$is_args$args;
  }

  location ~ ^/(?:author|category|tag|feed|wp-admin|wp-json)(?:/|$) {
    return 301 https://wisewolflanguage.com.br/blog$is_args$args;
  }

  location / {
    return 301 https://wisewolflanguage.com.br/blog$uri$is_args$args;
  }
}

server {
  listen 80 default_server;
  server_name wisewolflanguage.com.br www.wisewolflanguage.com.br;
  root /usr/share/nginx/html;
  index index.html;

  # Um único domínio canônico evita sinais duplicados de entidade.
  if ($host = www.wisewolflanguage.com.br) {
    return 301 https://wisewolflanguage.com.br$request_uri;
  }

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;

  location ~ /\.(?!well-known) {
    return 404;
  }

  location = /robots.txt {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=3600";
  }

  location = /sitemap.xml {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=3600";
  }

  location = /404.html {
    internal;
  }

  location = /cursos/business { return 301 https://wisewolflanguage.com.br/business-english; }
  location = /cursos/criancas { return 301 https://wisewolflanguage.com.br/ingles-para-criancas; }
  location = /cursos/viagens { return 301 https://wisewolflanguage.com.br/ingles-para-viagens; }
  location = /cursos { return 301 https://wisewolflanguage.com.br/; }
  location = /cursos/ { return 301 https://wisewolflanguage.com.br/; }
  location = /ingles-para-reunioes { return 301 https://wisewolflanguage.com.br/business-english; }

  location ~* \.(?:pdf|xml|txt|json|map)$ {
    try_files $uri =404;
    access_log off;
    add_header Cache-Control "public, max-age=3600";
  }

  location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|webp|ico|mp4|woff2?)$ {
    try_files $uri =404;
    access_log off;
    add_header Cache-Control "public, max-age=2592000, immutable";
  }

  location / {
    try_files $uri/index.html $uri =404;
    add_header Cache-Control "no-cache";
  }

  error_page 404 /404.html;
}
