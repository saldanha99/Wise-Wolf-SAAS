server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name app.wisewolflanguage.com.br system.wisewolflanguage.com.br;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # The HTML and PWA bootstrap must be revalidated so a cutover cannot keep
    # clients pinned to an old bundle/API endpoint.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location = /registerSW.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # Vite fingerprints files under /assets, so immutable caching is safe.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # React/Vite client-side routes must fall back to the SPA entry point.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
