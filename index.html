  <link rel="canonical" href="https://app.wisewolf.com.br">

  <!-- Open Graph (Facebook, WhatsApp, LinkedIn) -->

  <meta property="og:url" content="https://app.wisewolf.com.br">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="WiseCore - Plataforma de Gestão para Escolas de Idiomas">
  <meta name="twitter:description" content="Gerencie matrículas, pagamentos, trilhas didáticas e tutoria com IA. A plataforma completa para escolas de idiomas modernas.">
  <meta name="twitter:image" content="https://app.wisewolf.com.br/og-image.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --primary-color: #002366;
      --secondary-color: #D32F2F;
      --bg-ice-white: #F4F7F9;
    }

    .dark {
      --bg-ice-white: #020617;
    }

    body {
      background-color: var(--bg-ice-white);
      transition: background-color 0.3s ease;
    }

    .bg-tenant-primary {
      background-color: var(--primary-color);
    }

    .text-tenant-primary {
      color: var(--primary-color);
    }

    .border-tenant-primary {
      border-color: var(--primary-color);
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #f1f1f1;
    }

    .dark ::-webkit-scrollbar-track {
      background: #0f172a;
    }

    ::-webkit-scrollbar-thumb {
      background: #ccc;
      border-radius: 10px;
    }

    .dark ::-webkit-scrollbar-thumb {
      background: #334155;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--primary-color);
    }
  </style>
  <script>
    /* Initial theme script to prevent flickering */
    (function () {
      const theme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      if (theme === 'dark') document.documentElement.classList.add('dark');
    })();
  </script>

  <link rel="stylesheet" href="/index.css">
</head>

<body class="text-gray-900 dark:text-slate-100 transition-colors duration-300">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
