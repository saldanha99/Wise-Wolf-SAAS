# ============================================================================
# Cron: Streak Validation (hourly)
# Calls validate-streaks Edge Function.
# Scans tenants by timezone to determine which students missed their daily goal.
# Accepted latency: up to 1h vs midnight local.
# ============================================================================
name: "Cron: Streak Validation"

on:
  schedule:
    - cron: "0 * * * *"       # Every hour
  workflow_dispatch: {}

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  CRON_TRIGGER_SECRET: ${{ secrets.CRON_TRIGGER_SECRET }}

jobs:
  streak-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call validate-streaks
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST "${SUPABASE_URL}/functions/v1/validate-streaks" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${CRON_TRIGGER_SECRET}" \
            -d '{"trigger":"github-actions-hourly"}')

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          echo "Status: $HTTP_CODE"
          echo "Response: $BODY"

          if [ "$HTTP_CODE" -ge 500 ]; then
            echo "::error::Streak validation failed with HTTP $HTTP_CODE"
            exit 1
          fi
