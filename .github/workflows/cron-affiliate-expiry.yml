# ============================================================================
# Cron: Affiliate Conversion Expiry (daily 03:00 UTC-3 = 06:00 UTC)
# Calls expire-stale-conversions Edge Function.
# Expires prospects past trial_to_signup_window_days (default 30d).
# ============================================================================
name: "Cron: Affiliate Expiry"

on:
  schedule:
    - cron: "0 6 * * *"       # 06:00 UTC = 03:00 BRT
  workflow_dispatch: {}

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  CRON_TRIGGER_SECRET: ${{ secrets.CRON_TRIGGER_SECRET }}

jobs:
  affiliate-expiry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call expire-stale-conversions
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST "${SUPABASE_URL}/functions/v1/expire-stale-conversions" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${CRON_TRIGGER_SECRET}" \
            -d '{"trigger":"github-actions-daily"}')

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          echo "Status: $HTTP_CODE"
          echo "Response: $BODY"

          if [ "$HTTP_CODE" -ge 500 ]; then
            echo "::error::Affiliate expiry failed with HTTP $HTTP_CODE"
            exit 1
          fi
